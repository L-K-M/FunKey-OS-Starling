name: FunKey SDK Build

on:
  # No branch filter: workflow_dispatch does not support one, and the ref is
  # chosen when the run is started.
  workflow_dispatch:

concurrency:
  group: build-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
    - uses: actions/checkout@v4

    # Buildroot needs ~12GB for sources and build by-products (see README) and a
    # stock runner does not have much more than that free. Dropping toolchains
    # this build never uses buys back well over 20GB.
    - name: Free up disk space
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                    /usr/local/share/boost /usr/local/.ghcup \
                    /usr/local/lib/node_modules /opt/hostedtoolcache
        sudo apt-get -y purge '^llvm-.*' '^dotnet-.*' '^mongodb-.*' azure-cli || true
        sudo apt-get -y autoremove
        sudo apt-get -y clean
        df -h /

    - name: Install dependencies
      run: |
        sudo apt-get update
        # python/python-dev are Python 2 and no longer exist on 22.04; buildroot
        # builds with python3, which is listed below.
        sudo apt-get install -y -q --no-install-recommends make binutils build-essential gcc g++ patch bzip2 perl cpio unzip rsync file bc wget xxd libncurses5-dev cvs git mercurial liblscp-dev subversion python3 python3-dev python3-distutils python3-setuptools ca-certificates openssh-client expect locales sudo procps
        sudo apt-get -y autoremove
        sudo apt-get -y clean
        sudo rm -rf /var/lib/apt/lists/*
        sudo sed -i 's/# \(en_US.UTF-8\)/\1/' /etc/locale.gen
        sudo locale-gen --purge --lang en_US.UTF-8

    - name: Build SDK
      run: make sdk

    # The SDK carries Third-Party-Notices.txt; see the same check in build.yml.
    - name: Check the third-party notices in the SDK
      run: |
        set -euo pipefail
        sdk="images/$(make -s print-artifacts | sed -n 3p)"
        tar -xzOf "$sdk" --wildcards '*/share/licenses/Third-Party-Notices.txt' > "$RUNNER_TEMP/sdk.txt"
        test -s "$RUNNER_TEMP/sdk.txt"
        for pattern in '^host-gcc-final ' '^host-binutils ' '^gdb ' '^musl ' '^buildroot ' \
                       '^Source code: https://github.com/' 'GNU GENERAL PUBLIC LICENSE'; do
          grep -q -- "$pattern" "$RUNNER_TEMP/sdk.txt" || {
            echo "::error::the SDK's notices do not match '$pattern'"; exit 1; }
        done

    - name: List build results
      if: always()
      run: |
        df -h /
        ls -lh images/ || echo "no images directory"

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: funkey-sdk
        if-no-files-found: warn
        path: |
          images/*
          br.log
