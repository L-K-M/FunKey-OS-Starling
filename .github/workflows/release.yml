name: Release

# Publishes the SD card image, the firmware update file and the SDK as a GitHub
# Release, so getting a build needs neither a two-hour compile nor a GitHub
# account digging through a workflow run.
#
# Deliberately NOT triggered by pushing a tag. It was, and pushing
# FunKey-OS-3.0.0 published images that had never been booted on hardware --
# images built for the wrong console, which left an RG Nano at a grey screen.
# Publishing has to be a decision someone makes after testing a build on the
# device it names, not a side effect of tagging one. Restore the trigger below
# once a build has been verified on hardware.
#
#  push:
#    tags:
#      - 'Starling-*'
on:
  # Dispatch this with a tag selected as the ref; it refuses to run on a branch,
  # since a release has to point at a fixed commit. The check job below still
  # enforces the FunKey-OS-* name, so this is the only way to publish and it
  # still cannot publish from a branch or an unrelated tag.
  #
  # Cut the tag with tools/set-version.sh, which bumps every version string
  # in step, requires the CHANGELOG section this workflow reads, and pushes
  # the Starling-* tag.
  workflow_dispatch:

# Restrict every job, then grant write to publish alone. Omitting this block
# would not have been neutral: jobs would inherit the repository default, which
# is read-write on anything created before GitHub changed it, so the build --
# which compiles a great deal of third-party source -- would quietly hold write
# access to the repository. A called workflow runs with the calling job's token,
# so this covers the build too.
permissions:
  contents: read

# Unlike the build workflow, do not cancel: a superseded release build is still
# a release someone may be waiting on.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap gate so a mistaken dispatch fails in seconds rather than after the
  # build has run for two hours.
  check:
    runs-on: ubuntu-latest
    steps:
      # Dispatch is the only trigger and it can select any ref: a branch, or one
      # of the feature tags this repository also carries, several of them
      # inherited from upstream. Without the name check, dispatching on one of
      # those would build for two hours and then publish a public release named
      # after it.
      #
      # Starling-X.Y.Z, not upstream's FunKey-OS-X.Y.Z: this fork has its own
      # name and its own version line now, and a tag reading FunKey-OS-3.0.0
      # here would collide with the meaning it has upstream.
      - name: Refuse to release anything but a release tag
        if: ${{ github.ref_type != 'tag' || !startsWith(github.ref_name, 'Starling-') }}
        run: |
          echo "This workflow publishes a release and must run on a Starling-* tag."
          echo "Got $GITHUB_REF. Re-run it with a release tag selected as the ref."
          exit 1

  # Build through the ordinary build workflow rather than repeating its steps
  # here, so a release can never be built differently from everything else.
  build:
    needs: check
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The only job that writes anything.
    permissions:
      contents: write
    steps:
      # Needed only for the Makefile: the artifact names are asked of it rather
      # than repeated here, so renaming them is a one-line edit in one file.
      - uses: actions/checkout@v4

      # The build workflow uploads images/ and br.log as one artifact, rooted at
      # the repository directory, so the images arrive under build/images/.
      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: funkey-os-images
          path: build

      # Fail here, with the directory listing, rather than letting gh report a
      # bare "file not found" after the build has already run for two hours.
      - name: Check the expected images are there
        id: artifacts
        run: |
          ls -lh build/images/
          missing=0
          assets=()
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ -f "build/images/$f" ]; then
              assets+=("build/images/$f")
            else
              echo "::error::expected image missing from the build: $f"
              missing=1
            fi
          done < <(make -s print-artifacts)
          [ "${#assets[@]}" -gt 0 ] || {
            echo "::error::make print-artifacts named nothing"
            exit 1
          }
          [ "$missing" -eq 0 ] || {
            echo "The build did not produce every file the Makefile names."
            exit 1
          }
          printf '%s\n' "${assets[@]}" > assets.txt
          cat assets.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Names come from the Makefile, so the table describes whatever was
          # actually built rather than what this file remembers. mapfile rather
          # than read: read returns non-zero at EOF without a trailing newline,
          # which under the default bash -e would fail the step here.
          mapfile -t names < <(make -s print-artifacts)
          img=${names[0]}; fwu=${names[1]}; sdk=${names[2]}

          # The "## <tag>" section of CHANGELOG.md, if it has one. Never fatal:
          # a release that reached this step has a two-hour build behind it, and
          # a missing or misspelt heading is not worth throwing that away -- the
          # notes simply carry the table alone, as they did before.
          : > changes.md
          awk -v tag="## $TAG" '
            $0 == tag      { inside = 1; next }
            /^## /         { inside = 0 }
            inside         { print }
          ' CHANGELOG.md > changes.md 2>/dev/null || : > changes.md

          if [ -s changes.md ]; then
            echo "Found release notes for $TAG in CHANGELOG.md."
          else
            echo "::warning::No '## $TAG' section in CHANGELOG.md; publishing the file table alone."
          fi

          cat > notes.md <<NOTES
          **Starling** — FunKey OS for the **Anbernic RG Nano**, with Favorites.

          > Built from the \`rg_nano\` branch. It will **not** boot a FunKey S,
          > Q36 Mini or GBA Mini — those consoles use different kernels.

          | File | What it is |
          | --- | --- |
          | \`${img}\` | Full SD card image. Write it to a card to install. This erases the card. |
          | \`${fwu}\` | Firmware update. Copy it over USB to update in place, keeping games and saves. |
          | \`${sdk}\` | Cross-toolchain, needed only to build software for the console. |

          See the [README](https://github.com/${GITHUB_REPOSITORY}#install) for how to install or update.

          Starling's own code is GPL-2.0-or-later; source: https://github.com/${GITHUB_REPOSITORY}/tree/${TAG}.
          The images and the SDK bundle third-party components under their own licenses, among them four
          emulator cores under non-commercial terms. Their notices are in \`Third-Party-Notices.txt\`: on the
          console in \`/usr/share/licenses/\`, in the SDK under \`share/licenses/\`. See the
          [README](https://github.com/${GITHUB_REPOSITORY}#license).
          NOTES

          # Appended rather than interpolated into the heredoc: the changelog is
          # prose someone wrote, and \$ or \` in it would otherwise be expanded.
          cat changes.md >> notes.md

          mapfile -t assets < assets.txt

          # Re-runnable. gh release create refuses a tag that already has a
          # release, which would otherwise mean the first partial failure poisons
          # the tag for good -- and every retry here costs another full build.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refreshing its notes and assets."
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file notes.md
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "${assets[@]}"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file notes.md \
              "${assets[@]}"
          fi
