name: FunKey-OS Build

on:
  # Building the whole OS from source for hours to check a documentation typo is
  # not worth a runner's time. A change touching both docs and anything else
  # still builds: paths-ignore only skips when every changed file matches.
  # Spelled out twice rather than shared via a YAML anchor, which the Actions
  # workflow parser does not support.
  push:
    branches: [ rg_nano, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docker/**'
      # tools/ is host-side tooling (artwork generator, version check); the
      # OS build never reads it.
      - 'tools/**'
      # The other workflows validate themselves in their own runs; only a
      # change to this file changes what an OS build does. release.yml still
      # builds through workflow_call, to which path filters do not apply.
      - '.github/workflows/docker.yml'
      - '.github/workflows/retrofe-patches.yml'
      - '.github/workflows/versions.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/build_sdk.yml'
      - '.github/workflows/zai-code-review.yml'
      - '.github/workflows/licenses.yml'
  pull_request:
    branches: [ rg_nano, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docker/**'
      - 'tools/**'
      - '.github/workflows/docker.yml'
      - '.github/workflows/retrofe-patches.yml'
      - '.github/workflows/versions.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/build_sdk.yml'
      - '.github/workflows/zai-code-review.yml'
      - '.github/workflows/licenses.yml'
  # No branch filter here: workflow_dispatch does not support one, and the ref
  # is chosen when the run is started.
  workflow_dispatch:
  # Lets release.yml build through this workflow rather than keeping a second
  # copy of the same steps in step with this one. Path filters do not apply to
  # workflow_call, so a release still builds even for a docs-only tag.
  workflow_call:

# A full buildroot run is long and expensive, so do not let pushes pile up
# several of them against the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-22.04
    # Building the SDK toolchain and then the whole OS from source takes hours.
    # 360 is the hosted-runner maximum, and also the default: stated here so the
    # ceiling is visible to anyone reading the file rather than implied.
    timeout-minutes: 360

    steps:
    - uses: actions/checkout@v4

    # Buildroot needs ~12GB for sources and build by-products (see README) and a
    # stock runner does not have much more than that free. Dropping toolchains
    # this build never uses buys back well over 20GB.
    - name: Free up disk space
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                    /usr/local/share/boost /usr/local/.ghcup \
                    /usr/local/lib/node_modules /opt/hostedtoolcache
        sudo apt-get -y purge '^llvm-.*' '^dotnet-.*' '^mongodb-.*' azure-cli || true
        sudo apt-get -y autoremove
        sudo apt-get -y clean
        df -h /

    - name: Install dependencies
      run: |
        sudo apt-get update
        # python/python-dev are Python 2 and no longer exist on 22.04; buildroot
        # builds with python3, which is listed below.
        sudo apt-get install -y -q --no-install-recommends make binutils build-essential gcc g++ patch bzip2 perl cpio unzip rsync file bc wget xxd libncurses5-dev cvs git mercurial liblscp-dev subversion python3 python3-dev python3-distutils python3-setuptools ca-certificates openssh-client expect locales sudo procps
        sudo apt-get -y autoremove
        sudo apt-get -y clean
        sudo rm -rf /var/lib/apt/lists/*
        sudo sed -i 's/# \(en_US.UTF-8\)/\1/' /etc/locale.gen
        sudo locale-gen --purge --lang en_US.UTF-8

    - name: Build SDK
      run: make sdk

    - name: Build FunKey-OS
      run: make

    # Every file a release publishes carries Third-Party-Notices.txt, read
    # here out of the files themselves: both filesystems of the SD card image,
    # the rootfs inside the update file, and the SDK tarball. Each must also
    # name components it is known to bundle, so a stale or truncated file
    # fails too. licenses/notices.py writes them; see licenses/notices.ini.
    - name: Check the third-party notices in the images
      run: |
        set -euo pipefail
        tmp="$RUNNER_TEMP/notices"
        mkdir -p "$tmp"
        notices=usr/share/licenses/Third-Party-Notices.txt
        mapfile -t names < <(make -s print-artifacts)
        img="images/${names[0]}"; fwu="images/${names[1]}"; sdk="images/${names[2]}"

        # check FILE PATTERN...: FILE is not empty and matches every PATTERN.
        check() {
          local file=$1 pattern
          shift
          test -s "$file" || { echo "::error::no notices in $file"; return 1; }
          for pattern in "$@" '^Source code: https://github.com/' 'GNU GENERAL PUBLIC LICENSE'; do
            grep -q -- "$pattern" "$file" || {
              echo "::error::$file does not match '$pattern'"; return 1; }
          done
        }

        # The update file is a cpio archive around the gzipped FunKey rootfs.
        cpio -i --quiet --to-stdout rootfs.ext2.gz < "$fwu" | gunzip > "$tmp/fwu.ext2"
        debugfs -R "cat /$notices" "$tmp/fwu.ext2" > "$tmp/fwu.txt"
        check "$tmp/fwu.txt" '^busybox ' '^linux ' '^FunKey-sdk-2.3.0 toolchain' \
          '^snes9x2005$' '^picodrive$' '^mame2000$' '^fbalpha2012$' \
          'Reserved Font Name Cabin' 'SIL OPEN FONT LICENSE' 'LDEJRuff' 'orginaljun'

        # The SD card image: Recovery is the first partition in its MBR,
        # FunKey the second, and FunKey's must be the one the update installs.
        python3 - "$img" > "$tmp/partitions" <<'EOF'
        import struct, sys
        with open(sys.argv[1], "rb") as f:
            mbr = f.read(512)
        for i in range(4):
            start, size = struct.unpack("<II", mbr[454 + 16 * i:462 + 16 * i])
            if size:
                print(start, size)
        EOF
        n=0
        while read -r start size; do
          n=$((n + 1))
          dd if="$img" of="$tmp/p$n.ext4" bs=512 skip="$start" count="$size" status=none
          debugfs -R "cat /$notices" "$tmp/p$n.ext4" > "$tmp/p$n.txt"
        done < "$tmp/partitions"
        check "$tmp/p1.txt" '^busybox ' '^linux ' '^uboot ' '^FunKey-sdk-2.3.0 toolchain'
        cmp "$tmp/p2.txt" "$tmp/fwu.txt"

        tar -xzOf "$sdk" --wildcards '*/share/licenses/Third-Party-Notices.txt' > "$tmp/sdk.txt"
        check "$tmp/sdk.txt" '^host-gcc-final ' '^host-binutils ' '^gdb ' '^musl ' '^buildroot '

        wc -c "$tmp"/*.txt
        rm -rf "$tmp"

    - name: List build results
      if: always()
      run: |
        df -h /
        ls -lh images/ || echo "no images directory"

    # The .img is the flashable SD card image and the .fwu is the OS update
    # file; br.log is the buildroot log, which is what you need when a build
    # fails. Uploaded even on failure so a red run is diagnosable.
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: funkey-os-images
        if-no-files-found: warn
        path: |
          images/*
          br.log
