# What notices.py adds to Buildroot's legal-info when it writes
# Third-Party-Notices.txt for the FunKey and Recovery filesystems and the SDK.
#
# [own]              Starling's own license, printed first.
# [package <name>]   a Buildroot package (host packages as host-<name>):
#                      license  replaces the license Buildroot records
#                      files    license files to read from the package's
#                               extracted source, for metadata naming none
#                      texts    license texts vendored under texts/
#                      source   replaces the source line
#                      gap      no license text exists; why (printed)
# [core <name>]      an emulator core picoarch builds into /usr/games, with
#                    its license and source. Its COPYING/LICENSE/copyright
#                    files are collected from its clone; 'files' adds others,
#                    'library' names the installed file when it is not
#                    <name>_libretro.so.
# [asset <name>]     files from the rootfs overlay, by 'paths' (globs; a zip
#                    member is archive.zip!member) or by 'sha256', with a
#                    license, copyright, source, note, texts or gap. Every
#                    file [overlay] 'cover' matches needs exactly one section.
#
# notices.py fails when a component has neither a license text nor a 'gap'.
# A gap is a record of something to resolve, not an exemption.

[own]
name = Starling
# LICENSE is the GPL-2.0 text; the Makefile header grants "version 2 or (at
# your option) any later version".
license = GPL-2.0-or-later
texts = texts/GPL-2.0.txt
source = https://github.com/L-K-M/FunKey-OS-Starling/tree/{stamp}

[overlay]
cover = *.ttf *.otf *.wav


# ---------------------------------------------------------------- packages

# legal-info lists Buildroot itself, whose skeleton, init scripts and SDK
# helpers every artifact contains, without saving its source.
[package buildroot]
source = https://github.com/DrUm78/buildroot, the buildroot submodule of Starling's source

# Buildroot names license files only for the kernel versions it ships; a
# custom tarball gets none. DrUm78/linux v1.0-rg-nano is 4.14, whose COPYING
# holds both the GPL-2.0 and the syscall note.
[package linux]
files = COPYING

# The same for the SDK's 4.14.14 kernel headers.
[package linux-headers]
files = COPYING

# The same for U-Boot; u-boot-FunKey-1.00 is U-Boot 2020.10. Licenses/README
# says which of the other texts cover which files.
[package uboot]
files = Licenses/README
        Licenses/Exceptions
        Licenses/gpl-2.0.txt
        Licenses/lgpl-2.0.txt
        Licenses/lgpl-2.1.txt
        Licenses/bsd-2-clause.txt
        Licenses/bsd-3-clause.txt
        Licenses/eCos-2.0.txt
        Licenses/ibm-pibs.txt
        Licenses/isc.txt
        Licenses/mit.txt
        Licenses/x11.txt
        Licenses/OFL.txt
        Licenses/r8a779x_usb3.txt

# Buildroot 2021.02 records no license for gcc. The SDK ships the compiler
# and installs its runtime libraries into the sysroot.
[package host-gcc-initial]
license = GPL-3.0+, GPL-3.0+ with GCC Runtime Library Exception (runtime libraries), LGPL-2.1+, LGPL-3.0+
files = COPYING COPYING3 COPYING.LIB COPYING3.LIB COPYING.RUNTIME

[package host-gcc-final]
license = GPL-3.0+, GPL-3.0+ with GCC Runtime Library Exception (runtime libraries), LGPL-2.1+, LGPL-3.0+
files = COPYING COPYING3 COPYING.LIB COPYING3.LIB COPYING.RUNTIME

# The prebuilt FunKey-sdk-2.3.0 toolchain copies its C library and the GCC
# runtime libraries into both filesystems, and gdbserver into FunKey's, but
# carries no license files. FunKey-Project built it from musl 1.2.1, GCC
# 10.2.0 and GDB 9.2 (FunKey-OS-2.3.0's SDK/configs/funkey_defconfig; the
# shipped libc reports 1.2.1).
[package toolchain-external-custom]
name = FunKey-sdk-2.3.0 toolchain runtime: musl 1.2.1, the GCC 10.2.0 runtime libraries and, in the FunKey filesystem, the GDB 9.2 gdbserver
license = MIT (musl), GPL-3.0+ with GCC Runtime Library Exception (libgcc_s, libatomic, libstdc++), GPL-3.0+ (gdbserver)
texts = texts/musl-1.2.1-COPYRIGHT
        texts/gcc-10.2.0-COPYING3
        texts/gcc-10.2.0-COPYING.RUNTIME
source = https://github.com/FunKey-Project/FunKey-OS/releases/download/FunKey-OS-2.3.0 (FunKey-sdk-2.3.0.tar.gz)
         https://musl.libc.org/releases/musl-1.2.1.tar.gz
         https://ftp.gnu.org/gnu/gcc/gcc-10.2.0/gcc-10.2.0.tar.xz
         https://ftp.gnu.org/gnu/gdb/gdb-9.2.tar.xz

# Buildroot's dejavu.mk sets the license file but no license name.
[package dejavu]
license = Bitstream Vera Fonts License, Arev Fonts License, public domain (DejaVu changes)

# The libopk fork dropped upstream's LICENSE.txt (pcercuei/libopk, GPL-2.0);
# libopk.mk saves unsqfs.c's notice, this adds the text it refers to.
[package libopk]
texts = texts/GPL-2.0.txt

# FunKey-Project/FunKey-ProdScreens has no license file and no license
# notice in its sources.
[package ProdScreens]
gap = FunKey-Project/FunKey-ProdScreens states no license


